services:
  app:
    build: .
    ports:
      # Біндимо ЛИШЕ на localhost — nginx проксує на http://127.0.0.1:8080.
      # Без 127.0.0.1 порт стирчав би в інтернет (0.0.0.0) в обхід nginx (TLS/rate-limit).
      - "127.0.0.1:8080:3000"
    volumes:
      # persist database and uploads between restarts
      - ./data:/app/backend/data
      - ./uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      # REQUIRED — must be ≥32 chars (auth.js fails fast otherwise).
      # Generate once: openssl rand -hex 32  → put in .env (gitignored).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      # Telegram lead notifications (shared bot @termojet_ua_bot).
      # Set real values in a .env file next to this compose file (gitignored).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Forum-topic id inside the shared "Termojet Sales" group. Routes every
      # termojet lead into the "🔵 Termojet" topic, apart from TJ Heat Pumps.
      # Get it once via tjheatpump: /tg-create-lead-topics.php?secret=<WEBHOOK_SECRET>
      # (use the "termojet_leads_thread_id" value from its JSON output).
      - TELEGRAM_THREAD_ID=${TELEGRAM_THREAD_ID:-}
      # Forum-topic id for BINOTEL CALL cards (TJ Heat Pumps topic). CallTracking
      # lives on tjheatpump.com.ua, so call cards go to that topic, apart from the
      # termojet forms topic above. Empty → calls fall back to notifyLead default.
      - TELEGRAM_CALLS_THREAD_ID=${TELEGRAM_CALLS_THREAD_ID:-}
      # CORS allowlist override (comma-separated). Defaults in server.js cover the domain + current IP.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Nova Poshta API key (кабінет НП → Налаштування → Безпека → Ключі API).
      # Без нього /api/np віддає 503 і вибір міста/відділення в кошику не працює.
      - NOVA_POSHTA_API_KEY=${NOVA_POSHTA_API_KEY:-}
      # Binotel API PUSH — вхідні дзвінки → лід у CRM + Telegram (backend/routes/binotel.js).
      # COMPANY_ID + ALLOWED_IPS = верифікація вебхука; порожні → перевірку пропущено.
      - BINOTEL_COMPANY_ID=${BINOTEL_COMPANY_ID:-}
      - BINOTEL_ALLOWED_IPS=${BINOTEL_ALLOWED_IPS:-}
      - BINOTEL_API_KEY=${BINOTEL_API_KEY:-}
      - BINOTEL_API_SECRET=${BINOTEL_API_SECRET:-}
      # Resend — лист-підтвердження замовлення клієнту (backend/email.js).
      # RESEND_API_KEY з resend.com → API Keys; FROM на верифікованому домені
      # termojet.com.ua; BCC (необов'язково) — прихована копія замовлень менеджеру.
      # Без RESEND_API_KEY листи просто не відправляються (усе інше працює).
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-Termojet <zamovlennya@termojet.com.ua>}
      - ORDER_EMAIL_BCC=${ORDER_EMAIL_BCC:-}
    restart: unless-stopped
