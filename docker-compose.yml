services:
  app:
    build: .
    ports:
      - "8080:3000"
    volumes:
      # persist database and uploads between restarts
      - ./data:/app/backend/data
      - ./uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      # REQUIRED — must be ≥32 chars (auth.js fails fast otherwise).
      # Generate once: openssl rand -hex 32  → put in .env (gitignored).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      # Telegram lead notifications (shared bot @termojet_ua_bot).
      # Set real values in a .env file next to this compose file (gitignored).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # CORS allowlist override (comma-separated). Defaults in server.js cover the domain + current IP.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Nova Poshta API key (кабінет НП → Налаштування → Безпека → Ключі API).
      # Без нього /api/np віддає 503 і вибір міста/відділення в кошику не працює.
      - NOVA_POSHTA_API_KEY=${NOVA_POSHTA_API_KEY:-}
      # Binotel API PUSH — вхідні дзвінки → лід у CRM + Telegram (backend/routes/binotel.js).
      # COMPANY_ID + ALLOWED_IPS = верифікація вебхука; порожні → перевірку пропущено.
      - BINOTEL_COMPANY_ID=${BINOTEL_COMPANY_ID:-}
      - BINOTEL_ALLOWED_IPS=${BINOTEL_ALLOWED_IPS:-}
      - BINOTEL_API_KEY=${BINOTEL_API_KEY:-}
      - BINOTEL_API_SECRET=${BINOTEL_API_SECRET:-}
    restart: unless-stopped
