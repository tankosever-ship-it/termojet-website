services:
  app:
    build: .
    ports:
      - "8080:3000"
    volumes:
      # persist database and uploads between restarts
      - ./data:/app/backend/data
      - ./uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-termojet-jwt-secret-change-me}
      # Telegram lead notifications (shared bot @termojet_ua_bot).
      # Set real values in a .env file next to this compose file (gitignored).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
