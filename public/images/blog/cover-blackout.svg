<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#E85D04" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- lightning bolt -->
  <g transform="translate(190 130)">
    <path d="M150 0 L40 250 L130 250 L70 400 L260 150 L160 150 Z" fill="#E85D04"/>
    <path d="M150 0 L40 250 L130 250 L70 400 L260 150 L160 150 Z" fill="none" stroke="#ffb066" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- text -->
  <text x="560" y="265" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff">Опалення під</text>
  <text x="560" y="340" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#E85D04">час блекаутів</text>
  <text x="560" y="412" font-family="Arial, sans-serif" font-size="30" fill="#9ca3af">Як зробити котельню незалежною від мережі</text>
  <text x="560" y="495" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#E85D04" letter-spacing="4">TERMOJET</text>
</svg>
