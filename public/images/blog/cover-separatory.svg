<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E85D04"/>
  <!-- glyph: separator (vessel + rising bubbles + sludge) -->
  <g transform="translate(900 315)">
    <rect x="-80" y="-170" width="160" height="340" rx="44" fill="none" stroke="#E85D04" stroke-width="14"/>
    <line x1="-80" y1="-110" x2="-150" y2="-110" stroke="#E85D04" stroke-width="14"/>
    <line x1="80" y1="-110" x2="150" y2="-110" stroke="#E85D04" stroke-width="14"/>
    <g fill="#ffffff"><circle cx="-20" cy="-60" r="9"/><circle cx="20" cy="-100" r="7"/><circle cx="0" cy="-20" r="6"/><circle cx="28" cy="-40" r="5"/></g>
    <rect x="-60" y="120" width="120" height="40" rx="8" fill="#E85D04" opacity="0.55"/>
  </g>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#E85D04" letter-spacing="4">ІНЖЕНЕРНА СТАТТЯ</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Сепаратори</text>
  <text x="80" y="357" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#E85D04">шламу та повітря</text>
  <text x="80" y="415" font-family="Arial, sans-serif" font-size="30" fill="#9ca3af">навіщо вони потрібні</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="5">TERMOJET</text>
</svg>
