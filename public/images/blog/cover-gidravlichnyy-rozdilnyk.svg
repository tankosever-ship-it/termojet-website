  <text x="80" y="425" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#E85D04">роздільник</text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="5">TERMOJET</text>
