    </g>
  </g>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#E85D04" letter-spacing="4">ІНЖЕНЕРНА СТАТТЯ</text>
  <text x="80" y="305" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Розподільчі</text>
  <text x="80" y="372" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#E85D04">колектори</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="30" fill="#9ca3af">від вибору до монтажу</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="5">TERMOJET</text>
</svg>
