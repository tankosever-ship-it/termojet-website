<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E85D04"/>
  <!-- glyph: distribution manifold (bar + outlets) -->
  <g transform="translate(820 200)" stroke="#E85D04" stroke-width="14" fill="none">
    <rect x="0" y="0" width="300" height="46" rx="23" fill="#E85D04" stroke="none"/>
    <g stroke="#E85D04">
      <line x1="40" y1="46" x2="40" y2="150"/><circle cx="40" cy="170" r="18"/>
      <line x1="120" y1="46" x2="120" y2="150"/><circle cx="120" cy="170" r="18"/>
      <line x1="200" y1="46" x2="200" y2="150"/><circle cx="200" cy="170" r="18"/>
