    <!-- Шрифти — з власного домену (public/fonts, ліцензія OFL), а не з Google Fonts.

      @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}

    <!-- Google Tag Manager — з відкладеним стартом.
         GTM тягне за собою 1.06 МБ: сам gtm.js 380 кБ, gtag 566 кБ, Clarity 73 кБ
         і Binotel (calltracking). Усе це конкурувало за канал із LCP-зображенням:
         на сторінці товару gtag завершувався на 8987 мс, і лише потім, на 9021 мс,
         доходило головне фото — тобто саме LCP-елемент.
         Тепер стартуємо за найранішою з подій: перша взаємодія (pointerdown /
         keydown / touchstart / scroll) АБО простій браузера, але не пізніше 2.5 с.
         `dataLayer` створюємо ОДРАЗУ, тому події застосунку (analytics.js) стають
         у чергу й обробляються, щойно GTM підвантажиться — нічого не губиться.
         ⚠️ Через GTM іде й Binotel, який підміняє номери телефону в DOM. Жорсткий
         стель 2.5 с саме для цього: підміна встигає до будь-якого реального
         набору номера, інакше дзвінок втратив би атрибуцію.
         ⚠️ Компроміс: хто закриє сторінку швидше за 2.5 с і не торкнеться її —
         у статистику не потрапить. -->
    <script>(function(w,d,s,l,i){
      w[l]=w[l]||[];
      var started=false;
      var EV=['pointerdown','keydown','touchstart','scroll'];
      function start(){
        if(started)return; started=true;
        EV.forEach(function(e){w.removeEventListener(e,start,true)});
        w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
        var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
        j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
        f.parentNode.insertBefore(j,f);
      }
      EV.forEach(function(e){w.addEventListener(e,start,{once:true,passive:true,capture:true})});
      (w.requestIdleCallback||function(cb){return setTimeout(cb,1200)})(start,{timeout:2500});
    })(window,document,'script','dataLayer','GTM-P9DW9P6D');</script>
    <!-- End Google Tag Manager -->
    <!-- SSR-lite: серверний семантичний контент сторінки для краулерів (#seo-content).
         React рендериться у #root; щойно #root заповнюється — CSS ховає #seo-content
         (а main.jsx його прибирає). Краулери без JS / перша хвиля Google бачать контент. -->
    <style>
      /* ── Каркас сайту до гідратації ────────────────────────────────────────
         Раніше #seo-content був стилізований як звичайний документ: біле тло,
         колонка 940px, сині посилання, шрифт Rubik. На дроселі він висить на
         екрані ~2.9 с (FCP ≈ 1.1 с, React монтується ≈ 4.0 с), і перехід до
         справжнього дизайну виглядав як підміна сторінки.
         Тепер повторюємо шапку застосунку: смуга навбару 60px (Navbar.jsx —
         fixed, h-[60px], #0D0D0D), темний герой під H1 (PageHero.jsx —
         linear-gradient(160deg,#0C0B0A,#141414), білий текст), брендові
         шрифти (Archivo / IBM Plex Sans) і помаранчеві посилання замість синіх.
         Логотип — текстовий, щоб не додавати запит на критичний шлях.
         Розмітку #seo-content НЕ чіпаємо — усе робиться самим CSS. */
      #seo-content { font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: #0D0D0D; line-height: 1.6; }
      /* смуга навбару */
      #seo-content::before {
        content: 'TERMOJET'; display: block; height: 60px; line-height: 60px; padding: 0 22px;
        background: #0D0D0D; color: #FF5500;
        font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: .14em;
      }
      /* темна смуга-герой: хлібні крихти + H1 читаються як один банер */
      #seo-content > nav[aria-label="Хлібні крихти"],
      #seo-content > nav[aria-label="Breadcrumb"] { background: #0C0B0A; color: rgba(255,255,255,.45); font-size: 13px; padding: 30px 22px 0; }
      #seo-content > nav[aria-label="Хлібні крихти"] a,
      #seo-content > nav[aria-label="Breadcrumb"] a { color: rgba(255,255,255,.45); }
      #seo-content > h1 {
        background: linear-gradient(160deg, #0C0B0A, #141414); color: #fff;
        font-family: 'Archivo', system-ui, sans-serif; font-weight: 800;
        font-size: clamp(27px, 3.6vw, 44px); line-height: 1.14; letter-spacing: -.01em;
        margin: 0; padding: 26px 22px 56px; border-bottom: 1px solid rgba(232,93,4,.35);
      }
      #seo-content > h1:first-child { padding-top: 56px; }   /* коли крихт немає (статичні сторінки) */
      /* решта контенту — у контейнері тієї ж ширини, що й у застосунку */
      #seo-content > *:not(h1):not(nav[aria-label="Хлібні крихти"]):not(nav[aria-label="Breadcrumb"]) {
        max-width: 1180px; margin-left: auto; margin-right: auto; padding-left: 22px; padding-right: 22px;
      }
      #seo-content > h1 + * { margin-top: 26px; }   /* відступ ПІСЛЯ героя (не між крихтами і H1) */
      #seo-content h2 { font-family: 'Archivo', system-ui, sans-serif; font-size: 21px; font-weight: 700; margin: 30px auto 12px; color: #0D0D0D; border-bottom: 2px solid #FF5500; padding-bottom: 7px; }
      #seo-content h3 { font-family: 'Archivo', system-ui, sans-serif; font-size: 16px; font-weight: 700; margin: 18px auto 4px; color: #0D0D0D; }
      #seo-content p { margin: 10px auto; }
      #seo-content img { max-width: 340px; height: auto; float: right; margin: 4px 0 18px 26px; border: 1px solid #E5E5E5; padding: 8px; background: #fff; }
      #seo-content table { border-collapse: collapse; margin: 14px auto; font-size: 14px; clear: both; }
      #seo-content th, #seo-content td { border: 1px solid #E5E5E5; padding: 8px 12px; text-align: left; }
      #seo-content th { background: #F0EFEC; font-weight: 600; width: 44%; }
      #seo-content ul { margin: 10px auto; }
      #seo-content ul > li { margin: 5px 0 5px 20px; }
      #seo-content a { color: #CC4400; text-decoration: none; }
      #seo-content a:hover { text-decoration: underline; }
      #seo-content nav[aria-label="Основні розділи"], #seo-content nav[aria-label="Main sections"] { clear: both; margin-top: 34px; padding-top: 18px; border-top: 1px solid #E5E5E5; font-size: 14px; }
      #seo-content nav[aria-label="Основні розділи"] a, #seo-content nav[aria-label="Main sections"] a { display: inline-block; margin: 4px 16px 4px 0; }
      #root:not(:empty) ~ #seo-content { display: none; }
    </style>

    <div id="root"></div>
    <!-- Серверний SEO-контент сторінки: сервер наповнює його семантичним HTML
         (товари/категорії/блог/статичні), краулери бачать це в raw HTML. Замінив
         колишній статичний <noscript> — тепер контент per-page, а не загальний. -->
    <div id="seo-content"></div>
    <script type="module" src="/src/main.jsx"></script>
